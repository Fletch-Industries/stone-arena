    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:#121c20;color:#f4f0df;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 75% 40%,#34433b66,transparent 65%)}
    header,footer{position:relative;display:flex;align-items:center;justify-content:space-between;padding:28px clamp(24px,5vw,80px);gap:20px}
    .brand{display:flex;gap:12px;align-items:center;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.brand svg{width:30px;height:30px}.company{display:block;font-size:9px;letter-spacing:2.5px;color:#96a9a7;margin-top:5px}
    .status{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#d8b777;display:flex;gap:9px;align-items:center}.status:before{content:"";width:6px;height:6px;background:#dfb76b;box-shadow:0 0 14px #dfb76b44}
    main{position:relative;flex:1;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:20px;width:min(1320px,100%);margin:auto;padding:50px clamp(24px,5vw,80px) 70px}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;color:#deb777;text-transform:uppercase;margin:0 0 22px}h1{font-size:clamp(36px,4.4vw,66px);line-height:1.02;letter-spacing:-2.5px;text-transform:uppercase;margin:0;max-width:650px}h1 span{color:#dcb370;display:block}
    .message{font-size:clamp(18px,1.8vw,23px);line-height:1.55;color:#c8d2cd;max-width:440px;margin:28px 0 32px}.message strong{font-weight:400;color:#fff2d6}
    .refresh{display:inline-flex;align-items:center;gap:34px;text-decoration:none;color:#152020;background:#e6bd78;border:1px solid #f7d59d;padding:17px 23px;font-size:13px;font-weight:700;box-shadow:0 4px 0 #8d7046;transition:background .15s}.refresh:hover{background:#f8d7a0}.refresh:focus-visible{outline:3px solid #fff;outline-offset:6px}.refresh span{font-size:19px;line-height:1}
    .art{width:100%;max-width:550px;justify-self:center;filter:drop-shadow(0 30px 30px #0004)}.caption{font-size:10px;letter-spacing:2.3px;text-transform:uppercase;text-align:center;color:#8c9f99;margin-top:16px}
    footer{font-size:11px;color:#899c97;border-top:1px solid #314039;margin:0 clamp(24px,5vw,80px);padding:24px 0;letter-spacing:.4px}footer span:last-child{color:#acb7ad}
    @media(max-width:760px){header{padding-top:22px}.status{font-size:9px;letter-spacing:1px}main{grid-template-columns:1fr;padding-top:35px;padding-bottom:35px;gap:35px}h1{font-size:clamp(35px,8.5vw,56px);letter-spacing:-1.6px}.message{font-size:18px;margin:22px 0 26px}.art{max-width:360px}.caption{margin-top:4px}footer{font-size:10px;gap:12px}.company{font-size:8px}}
    @media(prefers-reduced-motion:reduce){.refresh{transition:none}}
  </style>
