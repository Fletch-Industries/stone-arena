name: Check
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Room lifecycle integration
        run: |
          npm run server > /tmp/stone-arena-server.log 2>&1 &
          arena_pid=$!
          trap 'kill "$arena_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3107/health; then break; fi
            sleep 1
          done
          npx tsx tests/room-lifecycle.ts
          npx tsx tests/lobby-discovery.ts
          npx tsx tests/exploration.ts
          npx tsx tests/multiplayer.ts
          npx tsx tests/healing-multiplayer.ts
          npx tsx tests/totem-multiplayer.ts
          npx tsx tests/capture-flag.ts
          npx tsx tests/wilds.ts
          npx tsx tests/wilds.ts --expedition
