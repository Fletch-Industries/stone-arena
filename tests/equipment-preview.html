<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment and fire preview</title><style>body{margin:0;font:14px system-ui;background:#172228;color:white}nav{position:fixed;top:12px;left:12px;padding:12px;background:#172228ee}button,select{padding:8px;margin:4px}output{display:block}</style></head><body><canvas id="world"></canvas><nav>Development preview · actual renderer and simulation<br><label>Armor <select id="armor"><option value="0">Unarmored</option><option value="50">Guard</option><option value="150" selected>Enchanted</option></select></label><label>Graphics <select id="quality"><option>low</option><option selected>medium</option><option>high</option></select></label><label><input type="checkbox" id="reduced">Reduced motion</label><br><button>Idle</button><button>Walk</button><button>Run</button><button>Jump</button><button>Attack</button><button>Hurt</button><button>Turn</button><button>Eat apple</button><output></output></nav><script type="module">
import { ArenaScene } from '/client/scene.ts';
import { Simulation } from '/server/simulation.ts';
import { DT, idleInput } from '/shared/game.ts';
const arena=new ArenaScene(document.querySelector('canvas')), sim=new Simulation();
const view=sim.add('viewer','Viewer'), actor=sim.add('actor','Armored player');
sim.phase='active';sim.practice=true;view.x=-14;view.z=-10;view.yaw=0;
let mode='Idle', t=0,eventId=0, previous=performance.now(),acc=0,facing=Math.PI;
const settings=()=>arena.settings(document.querySelector('#quality').value,60,document.querySelector('#reduced').checked);
settings();for(const id of ['quality','reduced'])document.querySelector('#'+id).onchange=settings;
function reset(){Object.assign(actor,{x:-13.5,z:-13,y:0,vy:0,vx:0,vz:0,grounded:true,yaw:facing,alive:true,hp:40,apples:2,charge:0,hurtTime:0});t=0;}
reset();for(const button of document.querySelectorAll('button'))button.onclick=()=>{mode=button.textContent;if(mode==='Turn')facing+=Math.PI/2;reset();if(mode==='Hurt')actor.hurtTime=.5;};
function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;acc+=dt;while(acc>=DT){acc-=DT;t++;actor.xp=Number(document.querySelector('#armor').value);sim.input(actor.id,{...idleInput(),seq:sim.tick+1,yaw:facing,z:mode==='Walk'||mode==='Run'?1:0,sprint:mode==='Run',jump:mode==='Jump',weapon:mode==='Eat apple'?'apple':'sword',attack:mode==='Attack'||mode==='Eat apple'});sim.step();if(t>180||Math.abs(actor.z+13)>1)reset();}
 for(const e of sim.events)if(e.id>eventId){arena.event(e);eventId=e.id;}arena.render(dt,sim.snapshot(),view,view,0,-.03,false,false);
 document.querySelector('output').textContent=`${Math.round(actor.hp)} HP · ${actor.apples} apples · ${arena.fps} FPS · ${arena.renderer.info.render.calls} draw calls · flame frames ${arena.flames.map(m=>Math.round(m.map.offset.y*16)).join(', ')}`;
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
